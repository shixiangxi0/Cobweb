<svg width="100%" viewBox="0 0 720 600" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Dual-World Architecture</title>
  <desc>Logic layer drives presentation layer through snapshots and frame-level visual drive</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <mask id="text-gaps" maskUnits="userSpaceOnUse">
      <rect x="0" y="0" width="720" height="600" fill="white"/>
      <!-- Persistent State -->
      <rect x="308" y="26" width="64" height="22" fill="black" rx="2"/>
      <rect x="306" y="44" width="68" height="19" fill="black" rx="2"/>
      <!-- Logic Layer -->
      <rect x="315" y="119" width="50" height="22" fill="black" rx="2"/>
      <rect x="260" y="138" width="160" height="19" fill="black" rx="2"/>
      <!-- Reducer -->
      <rect x="153" y="174" width="64" height="22" fill="black" rx="2"/>
      <rect x="135" y="195" width="100" height="19" fill="black" rx="2"/>
      <!-- Temp Window -->
      <rect x="453" y="174" width="92" height="22" fill="black" rx="2"/>
      <rect x="425" y="195" width="148" height="19" fill="black" rx="2"/>
      <!-- Submit / Trigger labels -->
      <rect x="313" y="170" width="56" height="19" fill="black" rx="2"/>
      <rect x="313" y="210" width="56" height="19" fill="black" rx="2"/>
      <!-- Snapshot -->
      <rect x="289" y="276" width="102" height="22" fill="black" rx="2"/>
      <!-- Snapshot Dispatch -->
      <rect x="354" y="316" width="56" height="19" fill="black" rx="2"/>
      <!-- Presentation Layer -->
      <rect x="315" y="360" width="50" height="22" fill="black" rx="2"/>
      <rect x="240" y="380" width="200" height="19" fill="black" rx="2"/>
      <!-- Frame-level Visual Drive -->
      <rect x="628" y="264" width="56" height="19" fill="black" rx="2"/>
      <rect x="628" y="280" width="56" height="19" fill="black" rx="2"/>
      <!-- Report Key Events -->
      <rect x="32" y="248" width="32" height="19" fill="black" rx="2"/>
      <rect x="20" y="264" width="56" height="19" fill="black" rx="2"/>
      <!-- Player Input -->
      <rect x="308" y="448" width="64" height="22" fill="black" rx="2"/>
      <rect x="288" y="467" width="104" height="19" fill="black" rx="2"/>
      <!-- Instant -->
      <rect x="188" y="326" width="56" height="19" fill="black" rx="2"/>
      <!-- Load / Write Back -->
      <rect x="256" y="78" width="32" height="19" fill="black" rx="2"/>
      <rect x="390" y="78" width="48" height="19" fill="black" rx="2"/>
    </mask>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="720" height="600" fill="#f7f7f5"/>

  <!-- Persistent State -->
  <g>
    <rect x="245" y="20" width="200" height="44" rx="8" stroke-width="0.5" fill="rgb(68, 68, 65)" stroke="rgb(180, 178, 169)"/>
    <text x="345" y="37" text-anchor="middle" dominant-baseline="central" fill="rgb(211, 209, 199)" font-size="14px" font-weight="500">持久状态</text>
    <text x="345" y="54" text-anchor="middle" dominant-baseline="central" fill="rgb(220, 218, 209)" font-size="14px" font-weight="500">跨场景存档</text>
  </g>

  <!-- Logic Layer Container -->
  <g>
    <rect x="60" y="108" width="570" height="200" rx="12" stroke-width="0.5" fill="rgb(60, 52, 137)" stroke="rgb(175, 169, 236)"/>
    <text x="345" y="130" text-anchor="middle" dominant-baseline="central" fill="rgb(206, 203, 246)" font-size="14px" font-weight="500">逻辑层</text>
    <text x="345" y="148" text-anchor="middle" dominant-baseline="central" fill="rgb(210, 205, 255)" font-size="14px" font-weight="500">串行 · 离散 · Source of Truth</text>
  </g>

  <!-- Reducer -->
  <g>
    <rect x="100" y="164" width="180" height="56" rx="8" stroke-width="0.5" fill="rgb(60, 52, 137)" stroke="rgb(175, 169, 236)"/>
    <text x="190" y="185" text-anchor="middle" dominant-baseline="central" fill="rgb(206, 203, 246)" font-size="14px" font-weight="500">瞬时结算</text>
    <text x="190" y="205" text-anchor="middle" dominant-baseline="central" fill="rgb(210, 205, 255)" font-size="14px" font-weight="500">Reducer · 纯函数</text>
  </g>

  <!-- Temp State Window -->
  <g>
    <rect x="410" y="164" width="180" height="56" rx="8" stroke-width="0.5" fill="rgb(60, 52, 137)" stroke="rgb(175, 169, 236)"/>
    <text x="500" y="185" text-anchor="middle" dominant-baseline="central" fill="rgb(206, 203, 246)" font-size="14px" font-weight="500">临时状态窗口</text>
    <text x="500" y="205" text-anchor="middle" dominant-baseline="central" fill="rgb(210, 205, 255)" font-size="14px" font-weight="500">Coroutine · 异步输入通道</text>
  </g>

  <!-- Temp Window → Reducer: Submit -->
  <line x1="410" y1="192" x2="280" y2="192" marker-end="url(#arrow)" fill="none" stroke="rgb(156, 154, 146)" stroke-width="1.5" mask="url(#text-gaps)"/>
  <text x="345" y="184" text-anchor="middle" fill="rgb(210, 205, 255)" font-size="14px" font-weight="500">提交结论</text>

  <!-- Reducer → Temp Window: Trigger -->
  <line x1="280" y1="216" x2="410" y2="216" marker-end="url(#arrow)" fill="none" stroke="rgb(156, 154, 146)" stroke-width="1.5" mask="url(#text-gaps)"/>
  <text x="345" y="224" text-anchor="middle" fill="rgb(210, 205, 255)" font-size="14px" font-weight="500">触发创建</text>

  <!-- Logic Snapshot -->
  <g>
    <rect x="245" y="272" width="200" height="30" rx="6" stroke-width="0.5" fill="rgb(60, 52, 137)" stroke="rgb(175, 169, 236)"/>
    <text x="345" y="287" text-anchor="middle" dominant-baseline="central" fill="rgb(206, 203, 246)" font-size="14px" font-weight="500">逻辑快照 · 只读</text>
  </g>

  <!-- Reducer → Snapshot -->
  <line x1="190" y1="220" x2="280" y2="271" marker-end="url(#arrow)" fill="none" stroke="rgb(156, 154, 146)" stroke-width="1.5"/>

  <!-- Snapshot → Presentation -->
  <line x1="345" y1="302" x2="345" y2="348" marker-end="url(#arrow)" fill="none" stroke="rgb(156, 154, 146)" stroke-width="1.5"/>
  <text x="363" y="330" text-anchor="start" fill="rgb(20, 20, 20)" font-size="14px" font-weight="500">快照下发</text>

  <!-- Presentation Layer Container -->
  <g>
    <rect x="60" y="348" width="570" height="64" rx="12" stroke-width="0.5" fill="rgb(8, 80, 65)" stroke="rgb(93, 202, 165)"/>
    <text x="345" y="371" text-anchor="middle" dominant-baseline="central" fill="rgb(159, 225, 203)" font-size="14px" font-weight="500">表现层</text>
    <text x="345" y="390" text-anchor="middle" dominant-baseline="central" fill="rgb(140, 240, 200)" font-size="14px" font-weight="500">并行 · 连续 · 声明式状态机 · 组件自治</text>
  </g>

  <!-- Temp Window → Presentation: Frame-level Visual Drive -->
  <path d="M590 220 Q625 290 590 348" fill="none" stroke="#1D9E75" stroke-width="1.5" marker-end="url(#arrow)" mask="url(#text-gaps)"/>
  <text x="632" y="278" text-anchor="start" fill="rgb(15, 110, 86)" font-size="14px" font-weight="500">帧级</text>
  <text x="632" y="294" text-anchor="start" fill="rgb(15, 110, 86)" font-size="14px" font-weight="500">视觉驱动</text>

  <!-- Presentation → Logic Layer: Report Key Events -->
  <path d="M110 348 Q72 270 100 165" fill="none" marker-end="url(#arrow)" stroke="rgb(156, 154, 146)" stroke-width="1.5" mask="url(#text-gaps)"/>
  <text x="48" y="262" text-anchor="middle" fill="rgb(20, 20, 20)" font-size="14px" font-weight="500">上报</text>
  <text x="48" y="278" text-anchor="middle" fill="rgb(20, 20, 20)" font-size="14px" font-weight="500">关键事件</text>

  <!-- Player Input -->
  <g>
    <rect x="265" y="442" width="160" height="44" rx="8" stroke-width="0.5" fill="rgb(68, 68, 65)" stroke="rgb(180, 178, 169)"/>
    <text x="345" y="459" text-anchor="middle" dominant-baseline="central" fill="rgb(211, 209, 199)" font-size="14px" font-weight="500">玩家输入</text>
    <text x="345" y="477" text-anchor="middle" dominant-baseline="central" fill="rgb(220, 218, 209)" font-size="14px" font-weight="500">分层映射到逻辑层</text>
  </g>

  <!-- Input → Reducer -->
  <path d="M300 442 L190 221" fill="none" marker-end="url(#arrow)" stroke="rgb(156, 154, 146)" stroke-width="1.5" mask="url(#text-gaps)"/>
  <text x="216" y="340" text-anchor="middle" fill="rgb(20, 20, 20)" font-size="14px" font-weight="500">普通指令</text>

  <!-- Persistent State ↔ Logic Layer -->
  <line x1="308" y1="64" x2="278" y2="107" marker-end="url(#arrow)" fill="none" stroke="rgb(156, 154, 146)" stroke-width="1.5" mask="url(#text-gaps)"/>
  <line x1="362" y1="107" x2="382" y2="64" marker-end="url(#arrow)" fill="none" stroke="rgb(156, 154, 146)" stroke-width="1.5"/>
  <text x="284" y="92" text-anchor="end" fill="rgb(20, 20, 20)" font-size="14px" font-weight="500">加载</text>
  <text x="394" y="92" text-anchor="start" fill="rgb(20, 20, 20)" font-size="14px" font-weight="500">写回</text>

</svg>
